name: docs

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the docs from (defaults to the latest tag)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Inject release version
        working-directory: docs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          version="${RELEASE_TAG}"
          if [ -z "$version" ]; then version="${DISPATCH_TAG}"; fi
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME}"; fi
          if [ -z "$version" ]; then version="$(git describe --tags --abbrev=0)"; fi
          mkdir -p _data
          printf 'release: %s\n' "$version" > _data/version.yml
      - name: Render PlantUML diagrams
        working-directory: docs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jre
          curl -fsSL "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml.jar" -o /tmp/plantuml.jar
          cd diagrams && java -jar /tmp/plantuml.jar -DRELATIVE_INCLUDE -tsvg -o . $(find . -maxdepth 1 -name '*.puml' ! -name 'C4*' -printf '%f ')
        env:
          PLANTUML_VERSION: 1.2026.7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build Jekyll site
        working-directory: docs
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
